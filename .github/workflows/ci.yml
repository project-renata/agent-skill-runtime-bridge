name: Infrastructure contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.9.13
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -q
      - run: uv run python -m unittest discover -s migrations -q
      - run: uv build
      - run: uv run python scripts/inspect_surface.py --output /tmp/bridge-surface.json
      - run: python3 cloudflare/build.py
