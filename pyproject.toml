[project]
name = "agent-skill-runtime-bridge"
version = "0.11.1"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7,<4",
    "py-key-value-aio[redis]>=0.4.5",
    "pypdf>=6,<7",
    "vercel-sandbox==0.4.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.31,<3",
    "workers-py",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.hatch.build.targets.sdist]
include = ["bridge", "api", "worker.py", "cloudflare", "examples", "scripts", "tests",
           "pyproject.toml", "uv.lock", "pylock.toml", "README.md", "ARCHITECTURE.md", "REPOSITORY_PROTOCOL.md",
           "maintenance", "docs", "LICENSE", "wrangler.jsonc", "vercel.json", "assets/bridge-icon.png"]
